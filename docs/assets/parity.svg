<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="OwnScout parity matrix: every port replays 28 base and 208 edge cases byte-for-byte">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="400" fill="#0a0a0a"/>
  <rect width="1000" height="400" fill="url(#grid)"/>
  <rect x="20.5" y="20.5" width="959" height="359" fill="none" stroke="#7ee787" stroke-opacity="0.3"/>

  <text x="48" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#7ee787" letter-spacing="3.4">TRACE EQUIVALENCE</text>
  <line x1="48" y1="82" x2="952" y2="82" stroke="#7ee787" stroke-opacity="0.22" stroke-width="1"/>
  <text x="48" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5c8f63" letter-spacing="1.6">replayed against the trace corpus — stdout and exit codes match exactly</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8fce97" letter-spacing="2.4">
    <text x="48" y="144">PORT</text>
    <text x="560" y="144" text-anchor="end">BASE</text>
    <text x="690" y="144" text-anchor="end">EDGE</text>
    <text x="820" y="144" text-anchor="end">TESTS</text>
    <text x="952" y="144" text-anchor="end">DEPS</text>
  </g>
  <line x1="48" y1="156" x2="952" y2="156" stroke="#7ee787" stroke-opacity="0.16" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <g>
      <text x="48" y="194" fill="#e8e8e8">GO REFERENCE</text>
      <text x="560" y="194" text-anchor="end" fill="#7ee787">28/28</text>
      <text x="690" y="194" text-anchor="end" fill="#7ee787">208/208</text>
      <text x="820" y="194" text-anchor="end" fill="#c8c8c8">69</text>
      <text x="952" y="194" text-anchor="end" fill="#6f8f74">stdlib</text>
    </g>
    <g>
      <text x="48" y="232" fill="#e8e8e8">TYPESCRIPT</text>
      <text x="560" y="232" text-anchor="end" fill="#7ee787">28/28</text>
      <text x="690" y="232" text-anchor="end" fill="#7ee787">208/208</text>
      <text x="820" y="232" text-anchor="end" fill="#c8c8c8">149</text>
      <text x="952" y="232" text-anchor="end" fill="#6f8f74">none</text>
    </g>
    <g>
      <text x="48" y="270" fill="#e8e8e8">RUST</text>
      <text x="560" y="270" text-anchor="end" fill="#7ee787">28/28</text>
      <text x="690" y="270" text-anchor="end" fill="#7ee787">208/208</text>
      <text x="820" y="270" text-anchor="end" fill="#c8c8c8">38</text>
      <text x="952" y="270" text-anchor="end" fill="#6f8f74">none</text>
    </g>
    <g>
      <text x="48" y="308" fill="#e8e8e8">ZIG</text>
      <text x="560" y="308" text-anchor="end" fill="#7ee787">28/28</text>
      <text x="690" y="308" text-anchor="end" fill="#7ee787">208/208</text>
      <text x="820" y="308" text-anchor="end" fill="#c8c8c8">37</text>
      <text x="952" y="308" text-anchor="end" fill="#6f8f74">none</text>
    </g>
  </g>

  <line x1="48" y1="336" x2="952" y2="336" stroke="#7ee787" stroke-opacity="0.22" stroke-width="1"/>
  <text x="48" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5c8f63" letter-spacing="1.4">every case compared byte-for-byte · any divergence fails the gate</text>
</svg>