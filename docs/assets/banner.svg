<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="OwnScout — local-first evidence verification for autonomous agents">
  <title>OwnScout — local-first evidence verification for autonomous agents</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#e8e8e8" stroke-opacity="0.5" stroke-width="1"/>
    </pattern>
    <clipPath id="k1"><circle cx="150" cy="124" r="58"/></clipPath>
    <clipPath id="k2"><circle cx="118" cy="180" r="58"/></clipPath>
    <clipPath id="k3"><circle cx="182" cy="180" r="58"/></clipPath>
    <clipPath id="frame"><rect width="1200" height="320"/></clipPath>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7ee787" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ee787" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .scan  { animation: scan 10s cubic-bezier(.45,0,.55,1) infinite; }
    .hatch { animation: breathe 6s ease-in-out infinite; }
    .dot   { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .chip  { animation: chip 7.2s ease-in-out infinite; }
    .c2 { animation-delay: .6s } .c3 { animation-delay: 1.2s } .c4 { animation-delay: 1.8s }
    .halo  { animation: halo 6s ease-in-out infinite; }
    @keyframes scan  { 0% { transform: translateX(-360px) } 100% { transform: translateX(1200px) } }
    @keyframes breathe { 0%,100% { opacity: .34 } 50% { opacity: .62 } }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(.85) } 50% { opacity: 1; transform: scale(1.15) } }
    @keyframes chip  { 0%,100% { opacity: 0 } 6%,20% { opacity: .2 } 42% { opacity: 0 } }
    @keyframes halo  { 0%,100% { opacity: .05 } 50% { opacity: .17 } }
    @media (prefers-reduced-motion: reduce) {
      .scan, .hatch, .dot, .chip, .halo { animation: none }
      .chip { opacity: 0 } .halo { opacity: .09 } .hatch { opacity: .45 }
    }
  </style>

  <rect width="1200" height="320" fill="#0b0b0b"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="150" cy="150" r="190" fill="url(#glow)" class="halo"/>

  <g clip-path="url(#frame)">
    <rect x="-340" y="0" width="340" height="320" fill="url(#scan)" class="scan"/>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="319" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" fill="none">
    <path d="M18 18h18M18 18v18"/><path d="M1182 18h-18M1182 18v18"/>
    <path d="M18 302h18M18 302v-18"/><path d="M1182 302h-18M1182 302v-18"/>
  </g>

  <g fill="none" stroke="#e8e8e8" stroke-opacity="0.42" stroke-width="1" stroke-dasharray="3 4">
    <circle cx="150" cy="124" r="58"/><circle cx="118" cy="180" r="58"/><circle cx="182" cy="180" r="58"/>
  </g>
  <g clip-path="url(#k1)"><g clip-path="url(#k2)"><g clip-path="url(#k3)">
    <rect x="40" y="40" width="240" height="240" fill="url(#hatch)" class="hatch"/>
  </g></g></g>
  <g fill="#f2f2f2">
    <circle cx="150" cy="104" r="2.5" class="dot"/><circle cx="106" cy="208" r="2.5" class="dot" style="animation-delay:.4s"/><circle cx="194" cy="208" r="2.5" class="dot" style="animation-delay:.8s"/>
  </g>

  <line x1="150" y1="161" x2="256" y2="161" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="150" cy="161" r="2.5" fill="#f2f2f2"/>

  <text x="272" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="60" font-weight="500" fill="#f2f2f2" letter-spacing="8.5">OWNSCOUT</text>
  <line x1="272" y1="178" x2="1152" y2="178" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
  <text x="272" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#949494" letter-spacing="3.1">LOCAL-FIRST EVIDENCE VERIFICATION FOR AUTONOMOUS AGENTS</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#d0d0d0" letter-spacing="1.9">
    <g>
      <rect x="272" y="238" width="172" height="34" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect x="272" y="238" width="172" height="34" fill="#7ee787" class="chip" style="animation-delay:0s"/>
      <text x="358" y="260" text-anchor="middle">GO REFERENCE</text>
    </g>
    <g>
      <rect x="456" y="238" width="172" height="34" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect x="456" y="238" width="172" height="34" fill="#7ee787" class="chip c2"/>
      <text x="542" y="260" text-anchor="middle">TYPESCRIPT</text>
    </g>
    <g>
      <rect x="640" y="238" width="172" height="34" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect x="640" y="238" width="172" height="34" fill="#7ee787" class="chip c3"/>
      <text x="726" y="260" text-anchor="middle">RUST</text>
    </g>
    <g>
      <rect x="824" y="238" width="172" height="34" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect x="824" y="238" width="172" height="34" fill="#7ee787" class="chip c4"/>
      <text x="910" y="260" text-anchor="middle">ZIG</text>
    </g>
  </g>
  <text x="1152" y="260" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6e6e6e" letter-spacing="2">MIT</text>
</svg>
