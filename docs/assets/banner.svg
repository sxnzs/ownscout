    <circle cx="74" cy="74" r="36" fill="none" stroke="url(#accent)" stroke-width="7"/>
    <circle cx="74" cy="74" r="13" fill="url(#accent)"/>
    <path d="M74 28 L88 60 L74 74 L60 60 Z" fill="#3ce6bf"/>
    <path d="M74 120 L60 88 L74 74 L88 88 Z" fill="#5aa9ff" opacity="0.75"/>
    <circle cx="112" cy="36" r="9" fill="#3ce6bf"/>
  </g>
  <text x="272" y="152" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="80" font-weight="800" fill="#eef5ff" letter-spacing="-1.5">OwnScout</text>
  <text x="276" y="200" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#9fb3d1">Local-first evidence verification for autonomous agents</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">
    <g transform="translate(276,238)">
      <rect width="104" height="40" rx="20" fill="#12213a" stroke="#24406b"/><circle cx="24" cy="20" r="6" fill="#5aa9ff"/><text x="42" y="26" fill="#d7e5fb">Go</text>
    </g>
