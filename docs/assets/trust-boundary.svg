<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="OwnScout trust boundary: the repository is only ever read, the process runs and exits, and the single ledger write lands outside the repository">
  <title>OwnScout trust boundary</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .march { animation: march 2.6s linear infinite; }
    .spark { animation: spark 2.6s linear infinite; }
    .s2 { animation-delay: -1.3s }
    .card  { animation: card 9s ease-in-out infinite; }
    .k2 { animation-delay: -3s } .k3 { animation-delay: -6s }
    .cross { animation: cross 5.4s ease-in-out infinite; }
    .x2 { animation-delay: -1.35s } .x3 { animation-delay: -2.7s } .x4 { animation-delay: -4.05s }
    @keyframes march { to { stroke-dashoffset: -18 } }
    @keyframes spark { 0% { stroke-dashoffset: 118 } 100% { stroke-dashoffset: 0 } }
    @keyframes card  { 0%,100% { stroke-opacity: .18 } 12%,30% { stroke-opacity: .44 } 55% { stroke-opacity: .18 } }
    @keyframes cross { 0%,100% { opacity: .3 } 50% { opacity: .75 } }
    @media (prefers-reduced-motion: reduce) {
      .march, .spark, .card, .cross { animation: none }
      .spark { stroke-dashoffset: 0; stroke-opacity: 0 } .card { stroke-opacity: .22 } .cross { opacity: .5 }
    }
  </style>

  <rect width="1200" height="560" fill="#0b0b0b"/>
  <rect width="1200" height="560" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="559" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" fill="none">
    <path d="M18 18h18M18 18v18"/><path d="M1182 18h-18M1182 18v18"/>
    <path d="M18 542h18M18 542v-18"/><path d="M1182 542h-18M1182 542v-18"/>
  </g>

  <text x="56" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#f2f2f2" letter-spacing="5.2">TRUST BOUNDARY</text>
  <text x="56" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8f8f8f" letter-spacing="1.5">one process, one write, and that write lands outside the repository</text>
  <line x1="56" y1="112" x2="1144" y2="112" stroke="#ffffff" stroke-opacity="0.12"/>

  <line x1="802" y1="140" x2="802" y2="430" stroke="#ffffff" stroke-opacity="0.2" stroke-dasharray="4 5" class="march"/>
  <text x="802" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#6f6f6f" letter-spacing="2">WRITE BOUNDARY</text>

  <rect x="56" y="170" width="280" height="196" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" class="card"/>
  <text x="78" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#f2f2f2" letter-spacing="2.6">REPOSITORY</text>
  <line x1="78" y1="218" x2="314" y2="218" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="78" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a8a8a8" letter-spacing="1.2">packet.json</text>
  <text x="78" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a8a8a8" letter-spacing="1.2">envelope.json</text>
  <text x="78" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a8a8a8" letter-spacing="1.2">repo files + hashes</text>
  <line x1="78" y1="318" x2="314" y2="318" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="78" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#7ee787" letter-spacing="1.8">READ AND RE-HASHED</text>

  <rect x="460" y="170" width="280" height="196" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" class="card k2"/>
  <text x="482" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#f2f2f2" letter-spacing="2.6">OWNSCOUT</text>
  <line x1="482" y1="218" x2="718" y2="218" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="482" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a8a8a8" letter-spacing="1.2">contract validate</text>
  <text x="482" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a8a8a8" letter-spacing="1.2">evidence verify</text>
  <text x="482" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a8a8a8" letter-spacing="1.2">node verify · node bind</text>
  <text x="482" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a8a8a8" letter-spacing="1.2">ledger verify · ledger rotate</text>
  <line x1="482" y1="326" x2="718" y2="326" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="482" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#7ee787" letter-spacing="1.8">RUNS, THEN EXITS</text>

  <rect x="864" y="170" width="280" height="196" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" class="card k3"/>
  <text x="886" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#f2f2f2" letter-spacing="2.6">LEDGER</text>
  <line x1="886" y1="218" x2="1122" y2="218" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="886" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a8a8a8" letter-spacing="1.2">append-only, 1 MiB capped</text>
  <text x="886" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a8a8a8" letter-spacing="1.2">SHA-256 hash-chained</text>
  <text x="886" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a8a8a8" letter-spacing="1.2">rotation-point, no timestamps</text>
  <line x1="886" y1="318" x2="1122" y2="318" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="886" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#7ee787" letter-spacing="1.8">REPRODUCIBLE BYTES</text>

  <line x1="340" y1="268" x2="447" y2="268" stroke="#e8e8e8" stroke-opacity="0.5" stroke-width="1"/>
  <path d="M447 264 l9 4 l-9 4 z" fill="#e8e8e8" fill-opacity="0.7"/>
  <line x1="340" y1="268" x2="456" y2="268" stroke="#7ee787" stroke-opacity="0.85" stroke-width="2" stroke-dasharray="14 104" class="spark"/>
  <text x="398" y="256" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#8f8f8f" letter-spacing="1.2">READ</text>

  <line x1="744" y1="268" x2="851" y2="268" stroke="#e8e8e8" stroke-opacity="0.5" stroke-width="1"/>
  <path d="M851 264 l9 4 l-9 4 z" fill="#e8e8e8" fill-opacity="0.7"/>
  <line x1="744" y1="268" x2="860" y2="268" stroke="#7ee787" stroke-opacity="0.85" stroke-width="2" stroke-dasharray="14 102" class="spark s2"/>
  <text x="802" y="256" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#8f8f8f" letter-spacing="1.2">APPEND</text>

  <rect x="56" y="460" width="1088" height="76" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="80" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#6f6f6f" letter-spacing="1.8">DELIBERATELY ABSENT</text>
  <line x1="255" y1="478" x2="255" y2="518" stroke="#ffffff" stroke-opacity="0.12"/>
  <g class="cross"><path d="M272 492 l10 10 M282 492 l-10 10" stroke="#e8e8e8" stroke-opacity="0.45" stroke-width="1.2" fill="none"/>
  <text x="290" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a8a" letter-spacing="1.6">NETWORK</text></g>
  <g class="cross x2"><path d="M500 492 l10 10 M510 492 l-10 10" stroke="#e8e8e8" stroke-opacity="0.45" stroke-width="1.2" fill="none"/>
  <text x="518" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a8a" letter-spacing="1.6">DAEMON</text></g>
  <g class="cross x3"><path d="M719 492 l10 10 M729 492 l-10 10" stroke="#e8e8e8" stroke-opacity="0.45" stroke-width="1.2" fill="none"/>
  <text x="737" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a8a" letter-spacing="1.6">REPOSITORY WRITE</text></g>
  <g class="cross x4"><path d="M1023 492 l10 10 M1033 492 l-10 10" stroke="#e8e8e8" stroke-opacity="0.45" stroke-width="1.2" fill="none"/>
  <text x="1041" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8a8a8a" letter-spacing="1.6">DEPENDENCIES</text></g>
</svg>
