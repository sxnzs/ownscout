<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="OwnScout architecture: the Go reference records a trace corpus and TypeScript, Rust and Zig ports replay it byte-for-byte">
  <title>OwnScout architecture: one contract, four implementations</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e8e8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7ee787" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#e8e8e8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .flow  { stroke-dasharray: 5 9; animation: flow 3.4s linear infinite; }
    .f2 { animation-delay: -.6s } .f3 { animation-delay: -1.2s } .f4 { animation-delay: -1.8s }
    .f5 { animation-delay: -2.4s } .f6 { animation-delay: -3s } .f7 { animation-delay: -1s }
    .bar   { animation: bar 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .b2 { animation-delay: .3s } .b3 { animation-delay: .6s } .b4 { animation-delay: .9s }
    .b5 { animation-delay: 1.2s } .b6 { animation-delay: 1.5s } .b7 { animation-delay: 1.8s }
    .b8 { animation-delay: 2.1s } .b9 { animation-delay: 2.4s } .b10 { animation-delay: 2.7s }
    .b11 { animation-delay: 3s } .b12 { animation-delay: 3.3s } .b13 { animation-delay: 3.6s } .b14 { animation-delay: 3.9s }
    .node  { animation: node 8s ease-in-out infinite; }
    .n2 { animation-delay: -2s } .n3 { animation-delay: -4s } .n4 { animation-delay: -6s }
    .card  { animation: card 8s ease-in-out infinite; }
    .k2 { animation-delay: -2.6s } .k3 { animation-delay: -5.2s }
    @keyframes flow { to { stroke-dashoffset: -14 } }
    @keyframes bar  { 0%,100% { opacity: .4 } 50% { opacity: .95 } }
    @keyframes node { 0%,100% { fill-opacity: .02 } 12%,28% { fill-opacity: .07 } 50% { fill-opacity: .02 } }
    @keyframes card { 0%,100% { stroke-opacity: .18 } 12%,28% { stroke-opacity: .42 } 50% { stroke-opacity: .18 } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .bar, .node, .card { animation: none }
      .bar { opacity: .7 } .node { fill-opacity: .03 } .card { stroke-opacity: .22 }
    }
  </style>

  <rect width="1200" height="620" fill="#0b0b0b"/>
