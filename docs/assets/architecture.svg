<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="OwnScout architecture: a Go reference records an oracle corpus, and TypeScript, Rust and Zig ports replay it byte-for-byte">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0e1830"/>
    </linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5aa9ff"/><stop offset="1" stop-color="#3ce6bf"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a6a9c"/>
    </marker>
    <marker id="arrowc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a6a9c"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3ce6bf"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="52" y="62" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#eef5ff">One contract, four implementations</text>
  <text x="52" y="94" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#9fb3d1">The Go reference records the oracle; every port must replay it byte-for-byte.</text>

  <g transform="translate(52,150)">
    <rect width="300" height="150" rx="18" fill="#101d33" stroke="url(#go)" stroke-width="2.5"/>
    <text x="28" y="46" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef5ff">Go reference</text>
    <text x="28" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#9fb3d1">internal/</text>
    <text x="28" y="104" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#c6d6ef">The specification.</text>
    <text x="28" y="126" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#c6d6ef">62 tests, race-clean.</text>
  </g>

  <line x1="352" y1="225" x2="470" y2="225" stroke="#4a6a9c" stroke-width="2.5" marker-end="url(#arrowc)"/>

  <g transform="translate(480,150)">
    <rect width="300" height="150" rx="18" fill="#101d33" stroke="#24406b" stroke-width="2.5"/>
    <text x="28" y="46" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef5ff">Recorded oracle</text>
    <text x="28" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#9fb3d1">spec/parity/corpus*.json</text>
    <text x="28" y="104" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#c6d6ef">28 base + 81 edge cases</text>
    <text x="28" y="126" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#c6d6ef">exact stdout + exit codes</text>
  </g>

  <line x1="780" y1="225" x2="898" y2="225" stroke="#4a6a9c" stroke-width="2.5" marker-end="url(#arrowc)"/>

  <g font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <g transform="translate(908,96)">
      <rect width="240" height="80" rx="16" fill="#101d33" stroke="#24406b"/><circle cx="34" cy="40" r="9" fill="#3ce6bf"/><text x="58" y="34" font-size="19" font-weight="700" fill="#eef5ff">TypeScript</text><text x="58" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#9fb3d1">Node 24, no build</text>
    </g>
    <g transform="translate(908,192)">
      <rect width="240" height="80" rx="16" fill="#101d33" stroke="#24406b"/><circle cx="34" cy="40" r="9" fill="#ff9f68"/><text x="58" y="34" font-size="19" font-weight="700" fill="#eef5ff">Rust</text><text x="58" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#9fb3d1">edition 2021</text>
    </g>
    <g transform="translate(908,288)">
      <rect width="240" height="80" rx="16" fill="#101d33" stroke="#24406b"/><circle cx="34" cy="40" r="9" fill="#f0c33c"/><text x="58" y="34" font-size="19" font-weight="700" fill="#eef5ff">Zig</text><text x="58" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#9fb3d1">0.16, explicit alloc</text>
    </g>
  </g>

  <path d="M1028 384 C1028 548 300 548 202 384" fill="none" stroke="#3ce6bf" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrowg)"/>
  <text x="615" y="472" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#3ce6bf">byte-exact replay — any divergence fails the gate</text>

  <g transform="translate(52,516)">
    <rect width="1096" height="72" rx="16" fill="#0f1b2e" stroke="#1d3357"/>
    <text x="28" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8fa8c8">differential fuzz · corpus mutation testing · protected-path check</text>
    <text x="28" y="56" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#c6d6ef">The oracle is validated by deliberately broken reference builds, so a pass is evidence rather than a formality.</text>
  </g>
</svg>
